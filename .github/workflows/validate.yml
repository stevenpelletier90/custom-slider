# The gates a human runs before committing (CLAUDE.md: validate, size, test),
# now run by a machine on every push and PR too. Before this file existed
# nothing ran them unless someone remembered: the markdown drifted to
# 1204-character lines with `prettier --check` in validate the whole time.
name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-26.04
    # Playwright's own image: the browsers and every library they need are baked
    # in, so no job downloads apt packages. On 2026-10-27 `playwright install
    # --with-deps` pulled ~120 of them from GitHub's Ubuntu mirror at a crawl
    # for an hour, and every run in that hour hung or took 5-9 minutes in that
    # one step. resolute is Ubuntu 26.04, the runner's own release. --user 1001
    # is the runner's uid, so the checkout stays writable (Playwright's CI
    # docs). The tag is the @playwright/test version in package-lock.json: bump
    # it here, in the job below and in a11y.yml with that package, or `npm test`
    # fails with Playwright's "please update docker image" message.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-resolute
      options: --user 1001
    # 4-13 minutes when well. Without a ceiling a hung step waits out GitHub's
    # six hours: on 2026-10-27 three runs sat 40+ minutes inside `playwright
    # install --with-deps` with nothing failing. Thirty fails it loudly.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # stylelint (files + generated), eslint, prettier --check, check:looks,
      # check:vendor, typecheck.
      - run: npm run validate
      # Rebuilds dist and fails at the gzip budget in scripts/size.mjs.
      - run: npm run size
      # dist/ is CHECKED IN and is what demo/index.html and every dealer page
      # load, so a src/ change with a forgotten rebuild used to pass everything:
      # the step above rebuilds dist locally, the tests then measure the FRESH
      # build, and the stale committed files sail through untouched. This is the
      # only step that looks at what is actually in the repo (2026-09-15 review).
      - name: dist/ matches source
        run: git diff --exit-code -- dist || { echo "::error::dist/ is stale — run npm run build and commit dist/ with the source change"; exit 1; }
      # The whole suite runs on the chromium project only (`npm test`); the
      # engine's contract file runs on the other two engines in the job below.
      # Starts its own server on 8137 (webServer in playwright.config.mjs).
      - run: npm test
  # tests/engine.test.mjs on Firefox and WebKit: the engine's own contract on
  # authored markup, where the Safari and Firefox decisions in the source
  # (scrollend fallback, role="list", scroll-behavior) actually run. Its own job
  # so it runs beside the Chromium run, not after it.
  browsers:
    runs-on: ubuntu-26.04
    # The same image as validate (see there); it carries Firefox and WebKit too.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-resolute
      options: --user 1001
    # About a minute when well; the 2026-10-27 hang was this job's apt step.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:browsers
