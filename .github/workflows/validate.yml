# The gates a human runs before committing (CLAUDE.md: validate, size, test),
# now run by a machine on every push and PR too. Before this file existed
# nothing ran them unless someone remembered: the markdown drifted to
# 1204-character lines with `prettier --check` in validate the whole time.
name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # stylelint (files + generated), eslint, prettier --check, check:looks,
      # check:vendor.
      - run: npm run validate
      # Rebuilds dist and fails at the gzip budget in scripts/size.mjs.
      - run: npm run size
      # dist/ is CHECKED IN and is what demo/index.html and every dealer page
      # load, so a src/ change with a forgotten rebuild used to pass everything:
      # the step above rebuilds dist locally, the tests then measure the FRESH
      # build, and the stale committed files sail through untouched. This is the
      # only step that looks at what is actually in the repo (2026-09-15 review).
      - name: dist/ matches source
        run: git diff --exit-code -- dist || { echo "::error::dist/ is stale — run npm run build and commit dist/ with the source change"; exit 1; }
      # The whole suite runs on the chromium project only (`npm test`); the
      # engine's contract file runs on the other two engines in the job below.
      - run: npx playwright install --with-deps chromium
      # Starts its own server on 8137 (webServer in playwright.config.mjs).
      - run: npm test
  # tests/engine.test.mjs on Firefox and WebKit: the engine's own contract on
  # authored markup, where the Safari and Firefox decisions in the source
  # (scrollend fallback, role="list", scroll-behavior) actually run. Its own job
  # so the browser installs happen beside the Chromium run, not after it.
  browsers:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox webkit
      - run: npm run test:browsers
