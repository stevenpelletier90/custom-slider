<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dl-carousel — example catalog</title>
    <meta name="description" content="Copy-paste catalog for the in-house dependency-free scroll-snap slider: one example at a time, with the exact HTML and CSS that renders it." />
    <!-- inline so the page makes no request the repo can't serve (a missing favicon was a 404 in the console) -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23262626'/><rect x='5' y='11' width='14' height='10' rx='2' fill='%23fff'/><rect x='21' y='13' width='6' height='6' rx='2' fill='%23949494'/></svg>"
    />
    <link rel="stylesheet" href="../dist/dl-carousel.css" />
    <script src="../dist/dl-carousel.js" defer></script>
    <!-- Used by the "Bootstrap Icons arrows" example only. Sites that don't
         restyle the arrows never need this. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
      /* ==========================================================================
         Demo-app chrome ONLY — the sidebar, stage, and code panel.
         Nothing here styles a slider. Every example ships its own CSS inside its
         <template>, which is the same string the Copy button hands you, so what
         renders in the stage and what you paste can never drift apart.
         ========================================================================== */

      :root {
        --app-bg: #f6f7f9;
        --app-panel: #fff;
        --app-ink: #1c1f23;
        --app-muted: #5b6470;
        --app-line: #e2e5ea;
        --app-accent: #1a5fb4;
        --app-code-bg: #1c2128;
        --app-rail: 16rem;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        line-height: 1.5;
        color: var(--app-ink);
        background: var(--app-bg);
      }

      /* ---- header ------------------------------------------------------------ */

      .app-header {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1.5rem;
        align-items: baseline;
        padding: 0.9rem 1.25rem;
        background: var(--app-panel);
        border-bottom: 1px solid var(--app-line);
      }

      .app-header h1 {
        margin: 0;
        font-size: 1.05rem;
        letter-spacing: -0.01em;
      }

      .app-header p {
        flex: 1;
        margin: 0;
        font-size: 0.85rem;
        color: var(--app-muted);
      }

      .app-header a {
        font-size: 0.85rem;
        color: var(--app-accent);
      }

      /* ---- shell ------------------------------------------------------------- */

      .app {
        display: grid;
        grid-template-columns: var(--app-rail) minmax(0, 1fr);
        align-items: start;
      }

      /* ---- sidebar picker ---------------------------------------------------- */

      .app-nav {
        position: sticky;
        top: 0;
        max-height: 100vh;
        padding: 1rem 0.75rem 2rem;
        overflow-y: auto;
        border-right: 1px solid var(--app-line);
      }

      .app-nav h2 {
        margin: 1.25rem 0 0.35rem 0.5rem;
        font-size: 0.7rem;
        font-weight: 700;
        color: var(--app-muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .app-nav h2:first-child {
        margin-top: 0;
      }

      .app-nav ul {
        padding: 0;
        margin: 0;
        list-style: none;
      }

      .app-nav button {
        display: block;
        inline-size: 100%;
        padding: 0.4rem 0.5rem;
        font: inherit;
        font-size: 0.9rem;
        color: inherit;
        text-align: start;
        cursor: pointer;
        background: none;
        border: 0;
        border-radius: 6px;
        transition:
          background-color 150ms ease-in-out,
          color 150ms ease-in-out;
      }

      .app-nav button:hover {
        background: #eceff3;
      }

      .app-nav button[aria-current='true'] {
        font-weight: 600;
        color: var(--app-accent);
        background: #e7effa;
      }

      .app-nav button:focus-visible,
      .app-tabs button:focus-visible,
      .app-copy:focus-visible {
        outline: 3px solid var(--app-accent);
        outline-offset: 2px;
      }

      /* ---- main -------------------------------------------------------------- */

      .app-main {
        min-width: 0;
        padding: 1.5rem 1.75rem 4rem;
      }

      .app-title {
        margin: 0 0 0.25rem;
        font-size: 1.5rem;
        letter-spacing: -0.02em;
      }

      .app-blurb {
        max-width: 62ch;
        margin: 0 0 0.75rem;
        color: var(--app-muted);
      }

      .app-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin: 0 0 1.25rem;
        padding: 0;
        list-style: none;
      }

      .app-meta li {
        padding: 0.15rem 0.5rem;
        font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace;
        font-size: 0.75rem;
        color: var(--app-muted);
        background: var(--app-panel);
        border: 1px solid var(--app-line);
        border-radius: 999px;
      }

      /* The live example. Generous padding so overlaid arrows in the gutter have
         somewhere to sit without touching the panel edge. */
      .app-stage {
        padding: 1.5rem;
        margin-bottom: 1.5rem;
        background: var(--app-panel);
        border: 1px solid var(--app-line);
        border-radius: 10px;
      }

      /* ---- code panel -------------------------------------------------------- */

      .app-code {
        overflow: hidden;
        background: var(--app-code-bg);
        border-radius: 10px;
      }

      .app-code-bar {
        display: flex;
        gap: 0.25rem;
        align-items: center;
        padding: 0.4rem 0.5rem;
        border-bottom: 1px solid #2c333d;
      }

      .app-tabs {
        display: flex;
        flex: 1;
        gap: 0.25rem;
      }

      .app-tabs button {
        padding: 0.3rem 0.7rem;
        font: inherit;
        font-size: 0.82rem;
        color: #aeb6c2;
        cursor: pointer;
        background: none;
        border: 0;
        border-radius: 6px;
        transition:
          background-color 150ms ease-in-out,
          color 150ms ease-in-out;
      }

      .app-tabs button:hover {
        color: #fff;
      }

      .app-tabs button[aria-pressed='true'] {
        color: #fff;
        background: #2c333d;
      }

      .app-copy {
        padding: 0.3rem 0.8rem;
        font: inherit;
        font-size: 0.82rem;
        color: #cfd6e0;
        cursor: pointer;
        background: #2c333d;
        border: 0;
        border-radius: 6px;
        transition:
          background-color 150ms ease-in-out,
          color 150ms ease-in-out;
      }

      .app-copy:hover {
        color: #fff;
        background: #3a434f;
      }

      .app-code pre {
        max-height: 60vh;
        padding: 1rem;
        margin: 0;
        overflow: auto;
        font-size: 0.8rem;
        line-height: 1.55;
        color: #dde3ec;
      }

      .app-note {
        max-width: 72ch;
        padding: 0.75rem 1rem;
        margin-top: 1.25rem;
        font-size: 0.87rem;
        color: var(--app-muted);
        background: var(--app-panel);
        border: 1px solid var(--app-line);
        border-inline-start: 3px solid var(--app-accent);
        border-radius: 0 8px 8px 0;
      }

      .app-note code,
      .app-blurb code {
        font-size: 0.85em;
        background: #eceff3;
        border-radius: 4px;
        padding: 0.05rem 0.3rem;
      }

      /* ---- narrow: the rail becomes a scrolling strip above the stage -------- */

      @media (max-width: 767.98px) {
        .app {
          display: block;
        }

        .app-nav {
          position: static;
          display: flex;
          gap: 1rem;
          max-height: none;
          padding: 0.5rem 0.75rem;
          overflow-x: auto;
          white-space: nowrap;
          border-right: 0;
          border-bottom: 1px solid var(--app-line);
        }

        .app-nav > div {
          flex: 0 0 auto;
        }

        .app-nav h2 {
          margin: 0 0 0.15rem 0.5rem;
        }

        .app-nav ul {
          display: flex;
          gap: 0.25rem;
        }

        .app-main {
          padding: 1.25rem 1rem 3rem;
        }

        /* 1.5rem of stage padding eats a phone's width — the example needs it more. */
        .app-stage {
          padding: 0.75rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <h1>dl-carousel</h1>
      <p>Dependency-free scroll-snap slider. Pick an example — the code below it is exactly what renders above it.</p>
      <a href="../README.md">API reference</a>
    </header>

    <div class="app">
      <!-- Populated from the templates at the end of this file. -->
      <nav class="app-nav" aria-label="Examples"></nav>

      <main class="app-main">
        <h2 class="app-title" id="ex-title"></h2>
        <p class="app-blurb" id="ex-blurb"></p>
        <ul class="app-meta" id="ex-meta"></ul>

        <div class="app-stage" id="stage"></div>

        <section class="app-code" aria-label="Source for this example">
          <div class="app-code-bar">
            <div class="app-tabs" role="group" aria-label="Which source to show">
              <button type="button" data-pane="full" aria-pressed="true">Full page</button>
              <button type="button" data-pane="html" aria-pressed="false">HTML</button>
              <button type="button" data-pane="css" aria-pressed="false">CSS</button>
            </div>
            <button type="button" class="app-copy">Copy</button>
          </div>
          <pre><code id="code-out"></code></pre>
        </section>

        <p class="app-note" id="ex-note"></p>
      </main>
    </div>

    <!-- ====================================================================
         EXAMPLES. One <template> each: its own <style> plus its markup.
         The stage renders a clone; the code panel prints the same source.
         Add an example by adding a <template> — the sidebar builds itself.
         ==================================================================== -->

    <template
      data-ex="stock"
      data-group="Start here"
      data-title="Stock look — the base"
      data-tags="1 per view|default arrows|dots|no options"
      data-blurb="Untouched engine defaults: dark arrows overlaying the content edges, one dot per page sitting in space the CSS reserved <em>before</em> JS ran (which is why CLS is 0), and native snap scrolling. Every other example is site CSS layered over this."
      data-note="Start here when building a new slider: paste the <strong>Full page</strong> tab, then add <code>--dlc-per-view</code> breakpoints and restyle. Nothing below this line is engine behaviour — it is all site CSS."
    >
      <style>
        .demo-card {
          border: 1px solid #ddd;
          border-radius: 8px;
          overflow: hidden;
          block-size: 100%;
          box-sizing: border-box;
        }

        .demo-card-body {
          position: absolute;
          inset-inline: 0;
          inset-block-end: 0;
          padding: 4rem 1rem 1rem;
          /* strong enough to hold white text over bright photos (sky, chrome) */
          background: linear-gradient(rgb(0 0 0 / 0%), rgb(0 0 0 / 50%) 40%, rgb(0 0 0 / 88%));
          color: #fff;
          text-shadow: 0 1px 2px rgb(0 0 0 / 70%);
        }

        .demo-card-body h3 {
          margin: 0;
        }

        .demo-card-body p {
          margin: 0.15rem 0 0.5rem;
          color: #f0f0f0;
        }

        .demo-card-body a {
          margin: 0;
          color: #fff;
        }

        .demo-card h3 {
          margin: 0.75rem 1rem 0.25rem;
          font-size: 1.05rem;
        }

        .demo-card p {
          margin: 0 1rem 0.5rem;
          color: #555;
        }

        .demo-card a {
          display: inline-block;
          margin: 0 1rem 1rem;
        }

        .demo-stock .demo-card h3,
        .demo-stock .demo-card p {
          margin-inline: 4rem;
        }
      </style>

      <div class="dl-carousel demo-stock" data-slider aria-label="Stock look">
        <ul class="dl-carousel-track">
          <li class="dl-carousel-slide">
            <article class="demo-card">
              <h3>Default controls</h3>
              <p>Arrows overlay the content edges; dots live in space the CSS reserved before JS ran.</p>
            </article>
          </li>
          <li class="dl-carousel-slide">
            <article class="demo-card">
              <h3>One knob per look</h3>
              <p>Every visual above this section is <code>--dlc-*</code> custom properties and plain site CSS.</p>
            </article>
          </li>
          <li class="dl-carousel-slide">
            <article class="demo-card">
              <h3>Works without JS</h3>
              <p>The track is a native scroll-snap container — disable JavaScript and it still swipes.</p>
            </article>
          </li>
          <li class="dl-carousel-slide">
            <article class="demo-card">
              <h3>Start here</h3>
              <p>Copy the markup below, add <code>--dlc-per-view</code> breakpoints, then restyle.</p>
            </article>
          </li>
        </ul>
      </div>
    </template>

    <template
      data-ex="vehicles"
      data-group="Cards"
      data-title="Featured vehicles"
      data-tags="1 / 2 / 3 per view|stretched link|step: page"
      data-blurb="Photo-as-card with the text overlaid on a gradient, and the whole card clickable via a stretched link. 1 up on phones, 2 from 576px, 3 from 992px."
      data-note="The whole card is clickable through a stretched <code>::after</code> on the existing “View details” link — no nested-link or duplicate-announcement problems, and keyboard focus still lands on one control per card."
    >
      <style>
        .demo-card {
          border: 1px solid #ddd;
          border-radius: 8px;
          overflow: hidden;
          block-size: 100%;
          box-sizing: border-box;
        }

        .demo-card-body {
          position: absolute;
          inset-inline: 0;
          inset-block-end: 0;
          padding: 4rem 1rem 1rem;
          /* strong enough to hold white text over bright photos (sky, chrome) */
          background: linear-gradient(rgb(0 0 0 / 0%), rgb(0 0 0 / 50%) 40%, rgb(0 0 0 / 88%));
          color: #fff;
          text-shadow: 0 1px 2px rgb(0 0 0 / 70%);
        }

        .demo-card-body h3 {
          margin: 0;
        }

        .demo-card-body p {
          margin: 0.15rem 0 0.5rem;
          color: #f0f0f0;
        }

        .demo-card-body a {
          margin: 0;
          color: #fff;
        }

        .demo-card h3 {
          margin: 0.75rem 1rem 0.25rem;
          font-size: 1.05rem;
        }

        .demo-card p {
          margin: 0 1rem 0.5rem;
          color: #555;
        }

        .demo-card a {
          display: inline-block;
          margin: 0 1rem 1rem;
        }

        .demo-vehicles {
          --dlc-per-view: 1;
        }

        @media (min-width: 576px) {
          .demo-vehicles {
            --dlc-per-view: 2;
          }
        }

        @media (min-width: 992px) {
          .demo-vehicles {
            --dlc-per-view: 3;
          }
        }

        .demo-vehicles {
          --dlc-arrow-bg: transparent;
          --dlc-arrow-fg: #262626;
          padding-inline: calc(var(--dlc-arrow-size) + 0.25rem);
        }

        .demo-vehicles .dl-carousel-arrow--prev {
          inset-inline-start: 0;
        }

        .demo-vehicles .dl-carousel-arrow--next {
          inset-inline-end: 0;
        }

        .demo-vehicles .dl-carousel-arrow svg {
          width: 28px;
          height: 28px;
        }

        .demo-vehicles .dl-carousel-arrow:hover {
          color: #000;
        }

        .demo-vehicles .demo-card {
          position: relative;
          border: 0;
        }

        .demo-vehicles .demo-card-body p {
          color: #fff;
        }

        .demo-vehicles .demo-card-body a::after {
          content: '';
          position: absolute;
          inset: -999px 0 0;
        }

        .demo-vehicles .demo-card-body a:focus-visible {
          outline: none;
        }

        .demo-vehicles .demo-card:has(.demo-card-body a:focus-visible) {
          outline: 3px solid var(--dlc-focus);
          outline-offset: -3px;
        }

        .demo-vehicles .demo-card img {
          border-radius: 8px;
        }

        .demo-vehicles .demo-card-body {
          border-end-start-radius: 8px;
          border-end-end-radius: 8px;
        }

        @media (max-width: 767.98px) {
          .demo-vehicles .demo-card img {
            aspect-ratio: 4 / 3;
            inline-size: 100%;
            object-fit: cover;
          }
        }

        @media (max-width: 575.98px) {
          .demo-vehicles .demo-card img {
            aspect-ratio: 3 / 4;
          }
        }
      </style>

      <div class="dl-carousel demo-vehicles" data-slider aria-label="Featured vehicles">
        <ul class="dl-carousel-track">
          <li class="dl-carousel-slide">
            <article class="demo-card">
              <img src="img/vehicle-1.jpg" width="800" height="500" alt="Black Porsche Panamera driving on a highway, rear three-quarter view" fetchpriority="high" />
              <div class="demo-card-body">
                <h3>2021 Porsche Panamera</h3>
                <p>$82,900 · 18,300 mi</p>
                <a href="#vehicle-1" aria-label="View details: 2021 Porsche Panamera">View details</a>
              </div>
            </article>
          </li>
          <li class="dl-carousel-slide">
            <article class="demo-card">
              <img src="img/vehicle-2.jpg" width="800" height="500" alt="Blue BMW 4 Series coupe parked on a city street, side view" />
              <div class="demo-card-body">
                <h3>2023 BMW 430i Coupe</h3>
                <p>$42,750 · 9,100 mi</p>
                <a href="#vehicle-2" aria-label="View details: 2023 BMW 430i Coupe">View details</a>
              </div>
            </article>
          </li>
          <li class="dl-carousel-slide">
            <article class="demo-card">
              <img src="img/vehicle-3.jpg" width="800" height="500" alt="White Ford Expedition on a desert road between red rock cliffs" />
              <div class="demo-card-body">
                <h3>2022 Ford Expedition Limited</h3>
                <p>$47,988 · 26,400 mi</p>
                <a href="#vehicle-3" aria-label="View details: 2022 Ford Expedition Limited">View details</a>
              </div>
            </article>
          </li>
          <li class="dl-carousel-slide">
            <article class="demo-card">
              <img src="img/vehicle-4.jpg" width="800" height="500" alt="White Honda CR-V parked near snowy mountains" loading="lazy" decoding="async" />
              <div class="demo-card-body">
                <h3>2023 Honda CR-V EX-L</h3>
                <p>$33,450 · 12,900 mi</p>
                <a href="#vehicle-4" aria-label="View details: 2023 Honda CR-V EX-L">View details</a>
              </div>
            </article>
          </li>
          <li class="dl-carousel-slide">
            <article class="demo-card">
              <img src="img/vehicle-5.jpg" width="800" height="500" alt="White Nissan GT-R from behind on an open country road" loading="lazy" decoding="async" />
              <div class="demo-card-body">
                <h3>2020 Nissan GT-R Premium</h3>
                <p>$98,500 · 7,200 mi</p>
                <a href="#vehicle-5" aria-label="View details: 2020 Nissan GT-R Premium">View details</a>
              </div>
            </article>
          </li>
          <li class="dl-carousel-slide">
            <article class="demo-card">
              <img src="img/vehicle-6.jpg" width="800" height="500" alt="Light blue Fiat 500 parked beside a stone building, side view" loading="lazy" decoding="async" />
              <div class="demo-card-body">
                <h3>2019 Fiat 500 Lounge</h3>
                <p>$13,995 · 31,800 mi</p>
                <a href="#vehicle-6" aria-label="View details: 2019 Fiat 500 Lounge">View details</a>
              </div>
            </article>
          </li>
        </ul>
      </div>
    </template>

    <template
      data-ex="cards"
      data-group="Cards"
      data-title="Service cards"
      data-tags="1 / 2 / 3 per view|data-step=slide|equal height"
      data-blurb="Rebuild of the Skaug Law practice-area strip: equal-height cards with a fixed-aspect cover image, and arrows that advance <em>one card</em> at a time."
      data-note='<code>data-step="slide"</code> is the slick-style feel — one card per arrow click instead of a whole page. Dots stay one-per-page either way.'
    >
      <style>
        .demo-cards {
          --dlc-per-view: 1;
          --dlc-controls-space: 0px; /* keep the unit — unitless 0 breaks the arrow-centering calc */
          --dlc-arrow-bg: transparent;
          --dlc-arrow-fg: #262626;
          padding-inline: calc(var(--dlc-arrow-size) + 0.25rem);
        }

        @media (min-width: 576px) {
          .demo-cards {
            --dlc-per-view: 2;
          }
        }

        @media (min-width: 992px) {
          .demo-cards {
            --dlc-per-view: 3;
          }
        }

        .demo-cards .dl-carousel-dots {
          display: none;
        }

        .demo-cards .dl-carousel-arrow--prev {
          inset-inline-start: 0;
        }

        .demo-cards .dl-carousel-arrow--next {
          inset-inline-end: 0;
        }

        .demo-service-card {
          display: flex;
          flex-direction: column;
          box-sizing: border-box;
          block-size: 100%;
          overflow: hidden;
          color: inherit;
          text-decoration: none;
          background: #fff;
          border: 1px solid #ddd;
          border-radius: 8px;
        }

        .demo-service-media {
          aspect-ratio: 8 / 5;
          overflow: hidden; /* clips the hover zoom, like the source site */
        }

        .demo-service-card img {
          inline-size: 100%;
          block-size: 100%;
          object-fit: cover;
        }

        .demo-service-card h3 {
          margin: 0.75rem 1rem 0.25rem;
          font-size: 1.05rem;
        }

        .demo-service-card p {
          flex-grow: 1;
          margin: 0 1rem 0.5rem;
          color: #555;
        }

        .demo-service-more {
          margin: 0 1rem 1rem;
          font-weight: 600;
          color: #1a5fb4;
        }

        .demo-service-card:hover img,
        .demo-service-card:focus-visible img {
          transform: scale(1.06);
        }

        @media (prefers-reduced-motion: no-preference) {
          .demo-service-card img {
            transition: transform 0.4s ease-out;
          }
        }

        .demo-service-card:focus-visible {
          outline: 3px solid var(--dlc-focus);
          outline-offset: -3px;
        }
      </style>

      <div class="dl-carousel demo-cards" data-slider data-step="slide" aria-label="Service cards">
        <ul class="dl-carousel-track">
          <li class="dl-carousel-slide">
            <a class="demo-service-card" href="#service" aria-label="Learn about the service center">
              <div class="demo-service-media"><img src="img/photo-5.jpg" width="1200" height="750" alt="" loading="lazy" decoding="async" /></div>
              <h3>Service Center</h3>
              <p>Factory-trained technicians, genuine parts, and online scheduling for everything from oil changes to major repairs.</p>
              <span class="demo-service-more" aria-hidden="true">Read more →</span>
            </a>
          </li>
          <li class="dl-carousel-slide">

    <template
      data-ex="models"
      data-group="Model bars"
      data-title="Explore Chevrolet models"
      data-tags="1 / 2 / 3 per view|progress bar|rewind: false"
      data-blurb="Rebuild of the LeadScience practice-area carousel: the stock dots restyled into one solid bar with a sliding thumb, driven entirely from the library's own dot state by a few lines of page script."
      data-note="The progress bar is <em>not</em> an engine feature. Page script watches the generated dots and sets two custom properties — the pattern for extending behaviour without touching the library. Listen for <code>dlc:change</code> or read <code>element._dlCarousel</code>."
    >
      <style>
        .demo-models {
          --dlc-arrow-bg: transparent;
          --dlc-arrow-fg: #262626;
          padding-inline: calc(var(--dlc-arrow-size) + 0.25rem);
        }

        .demo-models .dl-carousel-arrow--prev {
          inset-inline-start: 0;
        }

        .demo-models .dl-carousel-arrow--next {
          inset-inline-end: 0;
        }

        .demo-models .dl-carousel-arrow svg {
          width: 28px;
          height: 28px;
        }

        .demo-models .dl-carousel-arrow:hover {
          color: #000;
        }

        .demo-models {
          --dlc-per-view: 1;
          --dlc-gap: 0px; /* keep units — an unitless 0 breaks the basis calc */
          /* Segments are all track — the sliding ::before thumb marks the page.
          #949494 is 3.03:1 on white: the segments are real "go to page"
          buttons, so their extent has to meet WCAG 1.4.11 (was #e0e0e0 at
          1.32:1, which made the control invisible against the page). */
          --dlc-dot-fg: #949494;
          --dlc-dot-current: #949494;
          --dlc-controls-space: 3rem;
        }

        @media (min-width: 576px) {
          .demo-models {
            --dlc-per-view: 2;
          }
        }

        @media (min-width: 992px) {
          .demo-models {
            --dlc-per-view: 4;
            --dlc-arrow-size: 56px;
          }
          .demo-models .dl-carousel-arrow svg {
            width: 36px;
            height: 36px;
          }
        }

        .demo-models .dl-carousel-dots {
          gap: 0;
          inset-inline: 25%; /* the bar spans half the carousel, centered */
        }

        .demo-models .dl-carousel-dots::before {
          content: '';
          position: absolute;
          inset-inline-start: 0;
          inset-block-start: calc(50% - 2px);
          inline-size: calc(100% / var(--bar-count, 1));
          block-size: 4px;
          border-radius: 2px;
          background: #262626;
          translate: calc(var(--bar-index, 0) * 100%);
          pointer-events: none;
        }

        @media (prefers-reduced-motion: no-preference) {
          .demo-models .dl-carousel-dots::before {
            transition: translate 0.35s ease;
          }
        }

        .demo-models .dl-carousel-dot {
          flex: 1 1 auto;
        }

        .demo-models .dl-carousel-dot::after {
          inline-size: 100%;
          block-size: 4px;
          border-radius: 0;
        }

        .demo-models .dl-carousel-dot:first-child::after {
          border-start-start-radius: 2px;
          border-end-start-radius: 2px;
        }

        .demo-models .dl-carousel-dot:last-child::after {
          border-start-end-radius: 2px;
          border-end-end-radius: 2px;
        }

        .demo-model-card {
          position: relative;
          display: block;
          overflow: hidden;
          text-decoration: none;
        }

        .demo-model-card img {
          inline-size: 100%;
          block-size: auto;
          display: block;
        }

        .demo-model-card:hover img,
        .demo-model-card:focus-visible img {
          transform: scale(1.05);
        }

        @media (prefers-reduced-motion: no-preference) {
          .demo-model-card img {
            transition: transform 0.5s ease-out;
          }
        }

        .demo-model-card::after {

          background: linear-gradient(rgb(0 0 0 / 0%) 45%, rgb(0 0 0 / 88%) 100%);

    <script>
      /* ==========================================================================
         Demo-app controller. Renders ONE example at a time into the stage and
         prints the exact same source into the code panel.

         The parity rule: an example lives in a single <template> that holds its
         own <style> plus its markup. The stage gets a clone of that template; the
         code panel gets the template's own innerHTML. One source, two consumers —
         so "what you see" and "what you copy" cannot drift.
         ========================================================================== */

      (() => {
        const templates = [...document.querySelectorAll('template[data-ex]')];
        const nav = document.querySelector('.app-nav');
        const stage = document.getElementById('stage');
        const elTitle = document.getElementById('ex-title');
        const elBlurb = document.getElementById('ex-blurb');
        const elMeta = document.getElementById('ex-meta');
        const elNote = document.getElementById('ex-note');
        const out = document.getElementById('code-out');
        const tabs = [...document.querySelectorAll('.app-tabs button')];
        const copyBtn = document.querySelector('.app-copy');

        const STYLE_RE = /[ \t]*<style>([\s\S]*?)<\/style>\n?/;
        const BASE = '<link rel="stylesheet" href="dl-carousel.css">\n<script src="dl-carousel.js" defer></' + 'script>';

        /** Strip the common leading indentation the template picked up from the page. */
        const dedent = (s) => {
          const lines = s.replace(/^\n+/, '').replace(/\s+$/, '').split('\n');
          const widths = lines.filter((l) => l.trim()).map((l) => l.match(/^[ \t]*/)[0].length);
          const pad = widths.length ? Math.min(...widths) : 0;
          return lines.map((l) => l.slice(pad)).join('\n');
        };

        const sources = new Map(); // id -> { html, css, full }
        for (const t of templates) {
          const raw = t.innerHTML;
          const m = raw.match(STYLE_RE);
          const css = m ? dedent(m[1]) : '';
          const html = dedent(raw.replace(STYLE_RE, ''));
          sources.set(t.dataset.ex, {
            html,
            css,
            full: BASE + '\n\n<style>\n' + css + '\n</style>\n\n' + html,
          });
        }

        /* ---- per-example page script (site-level enhancement, not engine) ------ */

        const ENHANCERS = {
          // Sliding progress-bar thumb: driven from the library's own dot state.
          models(scope, signal) {
            const bar = scope.querySelector('.demo-models .dl-carousel-dots');
            if (!bar) return;
            const sync = () => {
              const dots = [...bar.children];
              const i = dots.findIndex((d) => d.classList.contains('dl-carousel-dot--current'));
              bar.style.setProperty('--bar-count', dots.length || 1);
              bar.style.setProperty('--bar-index', Math.max(0, i));
            };
            const mo = new MutationObserver(sync);
            mo.observe(bar, {
              subtree: true,
              childList: true,
              attributes: true,
              attributeFilter: ['class'],
            });
            signal.addEventListener('abort', () => mo.disconnect());
            sync();
          },

          // Native <dialog>: Esc and focus trapping come free; only the backdrop
          // click and the title swap need wiring.
          video(scope, signal) {
            const dialog = scope.querySelector('.demo-video-dialog');
            if (!dialog) return;
            const title = dialog.querySelector('.demo-video-dialog-title');
            for (const btn of scope.querySelectorAll('[data-video-title]')) {
              btn.addEventListener(
                'click',
                () => {
                  title.textContent = btn.dataset.videoTitle;
                  dialog.showModal();
                },
                { signal },
              );
            }
            dialog.querySelector('.demo-video-close').addEventListener('click', () => dialog.close(), { signal });
            dialog.addEventListener(
              'click',
              (e) => {
                if (e.target === dialog) dialog.close();
              },
              { signal },
            );
            // Leaving the example while the modal is open would strand the backdrop.
            signal.addEventListener('abort', () => dialog.open && dialog.close());
          },

          // APG tabs, automatic activation. Each pane holds its own auto-inited
          // carousel; the engine's ResizeObserver re-measures a strip when its pane
          // is revealed, so none of slick's hidden-pane height hacks are needed.
          'modelbar-tabs'(scope, signal) {
            for (const wrap of scope.querySelectorAll('[data-tabs]')) {
              const tabEls = [...wrap.querySelectorAll('[role="tab"]')];
              const panes = tabEls.map((t) => scope.querySelector('#' + t.getAttribute('aria-controls')));
              const select = (i) =>
                tabEls.forEach((t, j) => {
                  t.setAttribute('aria-selected', String(i === j));
                  t.tabIndex = i === j ? 0 : -1;
                  panes[j].hidden = i !== j;
                });
              tabEls.forEach((t, i) => t.addEventListener('click', () => select(i), { signal }));
              wrap.querySelector('[role="tablist"]').addEventListener(
                'keydown',
                (e) => {
                  const i = tabEls.indexOf(e.target);
                  if (i === -1) return;
                  let n = null;
                  if (e.key === 'ArrowRight') n = (i + 1) % tabEls.length;
                  else if (e.key === 'ArrowLeft') n = (i - 1 + tabEls.length) % tabEls.length;
                  else if (e.key === 'Home') n = 0;
                  else if (e.key === 'End') n = tabEls.length - 1;
                  if (n === null) return;
                  e.preventDefault();
                  tabEls[n].focus();
                  select(n);
                },
                { signal },
              );
            }
          },

          // Mouse drag on the THUMB STRIP. The engine's own drag covers the track,
          // not this strip, so it still needs its own wiring.
          gallery(scope, signal) {
            for (const strip of scope.querySelectorAll('.dl-carousel-thumbs')) {
              let startX = 0,
                startLeft = 0,
                dragging = false,
                moved = false;
              strip.addEventListener(
                'pointerdown',
                (e) => {
                  if (e.pointerType !== 'mouse' || e.button !== 0) return;
                  dragging = true;
                  moved = false;
                  startX = e.clientX;
                  startLeft = strip.scrollLeft;
                },
                { signal },
              );
              strip.addEventListener(
                'pointermove',
                (e) => {
                  if (!dragging) return;
                  const dx = e.clientX - startX;
                  if (!moved && Math.abs(dx) > 4) {
                    moved = true;
                    strip.setPointerCapture(e.pointerId);
                  }
                  if (moved) strip.scrollLeft = startLeft - dx;
                },
                { signal },
              );
              const end = () => {
                dragging = false;
              };
              strip.addEventListener('pointerup', end, { signal });
              strip.addEventListener('pointercancel', end, { signal });
              strip.addEventListener('dragstart', (e) => e.preventDefault(), {
                signal,
              });
              strip.addEventListener(
                'click',
                (e) => {
                  if (moved) {
                    e.preventDefault();
                    e.stopPropagation();
                    moved = false;
                  }
                },
                { signal, capture: true },
              );
            }
          },
        };

        /* ---- rendering --------------------------------------------------------- */

        let live = [];
        let ac = null;
        let current = null;

        function render(id) {
          const tpl = templates.find((t) => t.dataset.ex === id) || templates[0];
          id = tpl.dataset.ex;
          current = id;

          // Tear the previous example down completely: engine instances first
          // (destroy() restores their original markup), then every page-script
          // listener and observer via the shared signal, then the DOM itself. The
          // outgoing example's <style> leaves with its clone, so nothing it defined
          // can bleed into the next one — that isolation is why each snippet is
          // genuinely self-contained.
          live.forEach((s) => s.destroy());
          live = [];
          ac?.abort();
          ac = new AbortController();
          stage.replaceChildren(tpl.content.cloneNode(true));
          live = window.DLCarousel.autoInit(stage);
          ENHANCERS[id]?.(stage, ac.signal);

          elTitle.textContent = tpl.dataset.title;
          elBlurb.innerHTML = tpl.dataset.blurb || '';
          elMeta.replaceChildren(
            ...(tpl.dataset.tags || '')
              .split('|')
              .filter(Boolean)
              .map((t) => {
                const li = document.createElement('li');
                li.textContent = t;
                return li;
              }),
          );
          elNote.innerHTML = tpl.dataset.note || '';
          elNote.hidden = !tpl.dataset.note;

          for (const b of nav.querySelectorAll('button')) b.setAttribute('aria-current', String(b.dataset.go === id));
          paint();
          if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
        }

        const activeTab = () => tabs.find((t) => t.getAttribute('aria-pressed') === 'true').dataset.pane;
        const paint = () => {
          out.textContent = sources.get(current)[activeTab()];
        };

        /* ---- wiring ------------------------------------------------------------ */

        for (const group of new Set(templates.map((t) => t.dataset.group))) {
          const box = document.createElement('div');
          const h = document.createElement('h2');
          h.textContent = group;
          const ul = document.createElement('ul');
          for (const t of templates.filter((x) => x.dataset.group === group)) {
            const li = document.createElement('li');
            const b = document.createElement('button');
            b.type = 'button';
            b.textContent = t.dataset.title;
            b.dataset.go = t.dataset.ex;
            b.addEventListener('click', () => render(t.dataset.ex));
            li.append(b);
            ul.append(li);
          }
          box.append(h, ul);
          nav.append(box);
        }

        for (const t of tabs) {
          t.addEventListener('click', () => {
            tabs.forEach((x) => x.setAttribute('aria-pressed', String(x === t)));
            paint();
          });
        }

        copyBtn.addEventListener('click', async () => {
          const label = 'Copy';
          try {
            await navigator.clipboard.writeText(out.textContent);
            copyBtn.textContent = 'Copied';
          } catch {
            // The Clipboard API is blocked on file:// in some browsers — select the
            // text so Ctrl+C still works rather than failing silently.
            getSelection().selectAllChildren(out);
            copyBtn.textContent = 'Press Ctrl+C';
          }
          setTimeout(() => {
            copyBtn.textContent = label;
          }, 1600);
        });

        addEventListener('hashchange', () => {
          const id = location.hash.slice(1);
          if (id && id !== current && templates.some((t) => t.dataset.ex === id)) render(id);
        });

        // This script is inline, so it parses BEFORE the deferred engine script
        // executes and defines window.DLCarousel. Wait for DOMContentLoaded, which
        // fires after every deferred script has run.
        const boot = () => render(location.hash.slice(1) || templates[0].dataset.ex);
        if (window.DLCarousel) boot();
        else addEventListener('DOMContentLoaded', boot);
      })();
    </script>
  </body>
</html>
