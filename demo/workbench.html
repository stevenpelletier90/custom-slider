<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dl-carousel — workbench</title>
    <meta name="description" content="Configure a slider and copy the code. One component per pattern, settings that drive it, and code generated from the same settings." />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23262626'/><rect x='5' y='11' width='14' height='10' rx='2' fill='%23fff'/><rect x='21' y='13' width='6' height='6' rx='2' fill='%23949494'/></svg>"
    />
    <link rel="stylesheet" href="../dist/dl-carousel.css" />
    <script src="../dist/dl-carousel.js" defer></script>
    <script src="assets/looks.js" defer></script>
    <script src="assets/workbench.js" defer></script>

    <!-- Written by the workbench from the current settings. The same generator
         fills the code panel, with .wb-live swapped for .my-slider - which is
         why the code cannot drift from what you are looking at. -->
    <style id="wb-live-css"></style>

    <style>
      :root {
        --bg: #f6f7f9;
        --panel: #fff;
        --ink: #1c1f23;
        --muted: #5b6470;
        --line: #e2e5ea;
        --accent: #16324f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        line-height: 1.5;
        color: var(--ink);
        background: var(--bg);
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1.5rem;
        align-items: baseline;
        padding: 0.9rem 1.25rem;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        margin: 0;
        font-size: 1.05rem;
      }
      header p {
        flex: 1;
        margin: 0;
        font-size: 0.85rem;
        color: var(--muted);
      }
      main {
        max-width: 1400px;
        padding: 1.5rem;
        margin: 0 auto;
      }
      h2 {
        margin: 0 0 0.25rem;
        font-size: 1.5rem;
        letter-spacing: -0.02em;
      }
      .wb-blurb {
        max-width: 62ch;
        margin: 0 0 1.25rem;
        color: var(--muted);
      }
      .wb-stage {
        padding: 1.5rem;
        margin-bottom: 1.25rem;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .wb-cols {
        display: grid;
        grid-template-columns: 20rem minmax(0, 1fr);
        gap: 1.25rem;
        align-items: start;
      }
      #wb-settings {
        padding: 1rem 1.1rem;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      #wb-settings h3 {
        margin: 1.1rem 0 0.5rem;
        font-size: 0.72rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      #wb-settings section:first-child h3 {
        margin-top: 0;
      }
      .wb-row {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.4rem;
        font-size: 0.87rem;
      }
      .wb-row input[type='text'],
      .wb-row input[type='number'],
      .wb-row select {
        inline-size: 7.5rem;
        padding: 0.25rem 0.4rem;
        font: inherit;
        font-size: 0.85rem;
        border: 1px solid var(--line);
        border-radius: 5px;
      }
      .wb-row input[type='color'] {
        inline-size: 2.5rem;
        block-size: 1.6rem;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 5px;
      }
      .wb-perview {
        display: grid;
        gap: 0.15rem;
      }
      .wb-looks {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 0.4rem;
      }
      .wb-look {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        align-items: center;
        padding: 0.5rem 0.3rem;
        font: inherit;
        font-size: 0.75rem;
        color: inherit;
        cursor: pointer;
        background: none;
        border: 1px solid var(--line);
        border-radius: 7px;
      }
      .wb-look[aria-pressed='true'] {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      /* Thumbnails, because a dropdown reading "split photo card" helps nobody
         who does not already know they want it. */
      .wb-look-swatch {
        inline-size: 100%;
        block-size: 2.1rem;
        background: #e9edf1;
        border-radius: 4px;
      }
      .wb-look-swatch[data-look='split'] {
        background: linear-gradient(90deg, #b9c3cc 50%, #2f2f2f 50%);
      }
      .wb-look-swatch[data-look='portrait'] {
        background: linear-gradient(#14161b 62%, #fff 62%);
      }
      .wb-look-swatch[data-look='logo'] {
        background: #253a5e;
      }
      .wb-look-swatch[data-look='location'] {
        background: linear-gradient(#fff 62%, #c8102e 62%);
      }
      .wb-look-swatch[data-look='wordmark'] {
        background: linear-gradient(#3a3a3a, #1f1f1f);
      }
      .wb-code {
        overflow: hidden;
        background: #1c2128;
        border-radius: 10px;
      }
      .wb-code-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.45rem 0.6rem;
        font-size: 0.8rem;
        color: #aeb6c2;
        border-bottom: 1px solid #2c333d;
      }
      #wb-copy {
        padding: 0.3rem 0.8rem;
        font: inherit;
        font-size: 0.8rem;
        color: #cfd6e0;
        cursor: pointer;
        background: #2c333d;
        border: 0;
        border-radius: 6px;
      }
      #wb-copy:hover {
        color: #fff;
        background: #3a434f;
      }
      .wb-code pre {
        max-height: 30rem;
        padding: 1rem;
        margin: 0;
        overflow: auto;
        font-size: 0.78rem;
        line-height: 1.55;
        color: #dde3ec;
      }
      @media (max-width: 900px) {
        .wb-cols {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>dl-carousel workbench</h1>
      <p>Set it up the way you need it, then copy the code. The code below is generated from the settings — it is always what you are looking at.</p>
    </header>

    <main>
      <h2 id="wb-title"></h2>
      <p class="wb-blurb" id="wb-blurb"></p>

      <div class="wb-stage" id="wb-stage"></div>

      <div class="wb-cols">
        <div id="wb-settings"></div>
        <section class="wb-code" aria-label="Code for these settings">
          <div class="wb-code-bar">
            <span>Paste into the CMS — styles in <strong>Style Only</strong>, markup in a Custom HTML block</span>
            <button type="button" id="wb-copy">Copy</button>
          </div>
          <pre><code id="wb-code"></code></pre>
        </section>
      </div>
    </main>
  </body>
</html>
