<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Custom Slider — demo</title>
    <!-- GitHub Pages serves this repo from its root; the demo lives in /demo/.
         Redirect so the bare Pages URL lands on it, with a real link as the
         fallback for anyone the refresh doesn't move (and for crawlers). -->
    <meta http-equiv="refresh" content="0; url=./demo/" />
    <link rel="canonical" href="./demo/" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 4rem auto;
        max-width: 32rem;
        padding: 0 1rem;
        line-height: 1.5;
        color: #222;
      }
    </style>
  </head>
  <body>
    <!-- A landmark even here: anyone who reads this page at all is someone the
         refresh did not move — a crawler, or a browser with it disabled — and
         they get the same landmark structure as every other page. -->
    <main>
      <h1>Custom Slider</h1>
      <p>Dependency-free scroll-snap slider/carousel.</p>
      <p><a href="./demo/">Open the demo page</a> if you are not redirected automatically.</p>
    </main>
  </body>
</html>
